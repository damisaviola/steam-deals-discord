name: Steam Deals Discord Notification

on:
  schedule:
    # Run every 3 hours (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate without posting to Discord'
        required: false
        type: boolean
        default: false

# Prevent concurrent runs to avoid race conditions when writing storage history
concurrency:
  group: steam-deals
  cancel-in-progress: false

# Grant minimal permissions required for checking out and pushing deals.json
permissions:
  contents: write

jobs:
  notify-deals:
    name: Check Steam Deals & Notify Discord
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Deals Notification
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm start -- --dry-run
          else
            npm start
          fi
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MIN_DISCOUNT: ${{ vars.MIN_DISCOUNT || '50' }}
          MAX_PRICE: ${{ vars.MAX_PRICE || '100000' }}
          MAX_GAMES: ${{ vars.MAX_GAMES || '10' }}
          INCLUDE_FREE_GAMES: ${{ vars.INCLUDE_FREE_GAMES || 'false' }}
          CI: 'true'

      - name: Commit & Push Storage History
        run: |
          # Check if deals.json has modifications
          if git status --porcelain src/storage/deals.json | grep -q 'src/storage/deals.json'; then
            echo "Changes detected in src/storage/deals.json. Committing..."
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add src/storage/deals.json
            git commit -m "chore(storage): update notification history [skip ci]"
            git push
          else
            echo "No changes in deals.json. Nothing to commit."
          fi
